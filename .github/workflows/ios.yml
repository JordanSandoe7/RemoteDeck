name: iOS build and test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-webrtc-158-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-webrtc-158-

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project RemoteDeck.xcodeproj -scheme RemoteDeck

      - name: Run unit tests
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | grep -m 1 -E 'iPhone.*\([A-F0-9-]+\)' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')"
          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          xcodebuild test \
            -project RemoteDeck.xcodeproj \
            -scheme RemoteDeck \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned app
        run: |
          xcodebuild archive \
            -project RemoteDeck.xcodeproj \
            -scheme RemoteDeck \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/RemoteDeck.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/RemoteDeck.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "The archive did not contain an application."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/RemoteDeck.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qr "$GITHUB_WORKSPACE/RemoteDeck.ipa" Payload)
          unzip -l "$GITHUB_WORKSPACE/RemoteDeck.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDeck-unsigned-ipa
          path: RemoteDeck.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" RemoteDeck.ipa --clobber
          else
            gh release create "$TAG_NAME" RemoteDeck.ipa \
              --title "$TAG_NAME" \
              --notes "Unsigned RemoteDeck iOS build. Sign it with Sideloadly before installation."
          fi
